name: Publish

# Release: push the tag "v<mod_version>-1.20.1" (example: v1.2.0-1.20.1), or run it from the Actions tab.
# Secrets: MODRINTH_TOKEN, MODRINTH_PROJECT_ID, CURSEFORGE_TOKEN, CURSEFORGE_PROJECT_ID.
on:
  push:
    tags: ['v*-1.20.1']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: chmod +x gradlew && ./gradlew build

      - name: Read mod version
        id: mod
        run: echo "version=$(grep -E '^mod_version' gradle.properties | cut -d= -f2 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Publish Forge to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: forge/build/libs/*-forge.jar
          name: AE2 Pattern Counter ${{ steps.mod.outputs.version }} (Forge 1.20.1)
          version: ${{ steps.mod.outputs.version }}+forge-1.20.1
          version-type: release
          changelog-file: CHANGELOG.md

          loaders: forge
          game-versions: 1.20.1
          java: 17
          dependencies: |
            ae2(required){modrinth:XxWD5pD3}{curseforge:223794}
            architectury-api(required){modrinth:lhGA9TYQ}{curseforge:419699}

      - name: Publish Fabric to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: fabric/build/libs/*-fabric.jar
          name: AE2 Pattern Counter ${{ steps.mod.outputs.version }} (Fabric 1.20.1)
          version: ${{ steps.mod.outputs.version }}+fabric-1.20.1
          version-type: release
          changelog-file: CHANGELOG.md

          loaders: fabric
          game-versions: 1.20.1
          java: 17
          dependencies: |
            ae2(required){modrinth:XxWD5pD3}{curseforge:223794}
            architectury-api(required){modrinth:lhGA9TYQ}{curseforge:419699}
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
