name: Publish

# Release: push the tag "v<mod_version>-1.21.1" (example: v1.2.0-1.21.1), or run it from the Actions tab.
# Secrets: MODRINTH_TOKEN, MODRINTH_PROJECT_ID, CURSEFORGE_TOKEN, CURSEFORGE_PROJECT_ID.
on:
  push:
    tags: ['v*-1.21.1']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: chmod +x gradlew && ./gradlew build

      - name: Read mod version
        id: mod
        run: echo "version=$(grep -E '^mod_version' gradle.properties | cut -d= -f2 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: build/libs/!(*-@(dev|sources|javadoc)).jar
          name: AE2 Pattern Counter ${{ steps.mod.outputs.version }} (NeoForge 1.21.1)
          version: ${{ steps.mod.outputs.version }}+neoforge-1.21.1
          version-type: release
          changelog-file: CHANGELOG.md

          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          dependencies: |
            ae2(required){modrinth:XxWD5pD3}{curseforge:223794}
